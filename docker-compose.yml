services:
  db:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  gnuworld:
    build: .
    # We need 'host' mode to allow connection to ircu listening on the
    # tailscale interface.
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./bin:/app/conf:ro
    restart: unless-stopped

volumes:
  pgdata:
